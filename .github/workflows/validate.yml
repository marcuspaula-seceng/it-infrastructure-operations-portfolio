name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile-check Python sources
        run: |
          python -m py_compile \
            projects/02-asset-management-audit/src/asset_audit.py \
            projects/05-meeting-room-readiness/src/room_readiness_report.py \
            projects/06-itam-itsm-sqlite-research/src/reconcile_demo.py \
            tests/test_sqlite_reconciliation.py \
            tests/test_asset_audit.py \
            tests/test_room_readiness_report.py

      - name: Run unit tests (standard library)
        run: python -m unittest discover -s tests -p "test_*.py" -v

  powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check PowerShell script
        shell: pwsh
        run: |
          $path = 'projects/01-endpoint-imaging-optimisation/Get-EndpointReadiness.ps1'
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'PowerShell syntax OK'
